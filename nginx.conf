server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers: see security-headers.conf.inc (included per location, because
    # a location with its own add_header does not inherit the server's).
    include /etc/nginx/security-headers.conf.inc;

    location /assets/ {
        include /etc/nginx/security-headers.conf.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The Impressum and the privacy policy name the operator: keep them out of
    # search engines and archives (the page adds a robots tag as well).
    location ~ ^/(imprint|privacy|impressum|datenschutz)/?$ {
        include /etc/nginx/security-headers.conf.inc;
        add_header X-Robots-Tag "noindex, noarchive" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/security-headers.conf.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
