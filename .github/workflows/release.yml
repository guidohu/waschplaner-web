# Builds the website's Docker image for every version tag (v1.0.0, v1.2.3 …) and
# publishes it to the GitHub Container Registry as ghcr.io/<owner>/<repo>.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The image gets the tags 1.0.0, 1.0, 1 and latest. What is baked into the site
# comes from repository variables (Settings → Secrets and variables → Actions →
# Variables): VITE_APP_URL, VITE_REPO_URL, VITE_CONTACT_EMAIL, and the operator's
# VITE_OPERATOR_NAME, VITE_OPERATOR_ADDRESS and VITE_OPERATOR_UID. The release
# stops if the Impressum or privacy policy would still have a gap.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests, including the check that the legal pages are complete
        run: npm test
        env:
          RELEASE_CHECK: 1
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_OPERATOR_NAME: ${{ vars.VITE_OPERATOR_NAME }}
          VITE_OPERATOR_ADDRESS: ${{ vars.VITE_OPERATOR_ADDRESS }}
          VITE_OPERATOR_UID: ${{ vars.VITE_OPERATOR_UID }}

  image:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Intel/AMD servers and ARM ones (e.g. a Raspberry Pi or an ARM cloud server).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
            VITE_REPO_URL=${{ vars.VITE_REPO_URL }}
            VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL }}
            VITE_OPERATOR_NAME=${{ vars.VITE_OPERATOR_NAME }}
            VITE_OPERATOR_ADDRESS=${{ vars.VITE_OPERATOR_ADDRESS }}
            VITE_OPERATOR_UID=${{ vars.VITE_OPERATOR_UID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
